<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><link rel="icon" href="./icon-192.png"><title>R10 · 赤霄龍鎧人物工作台</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;background:#15151b;color:#e8d3aa;font:14px system-ui}canvas{display:block}#controls{position:absolute;z-index:2;top:18px;left:18px;background:#101017e8;padding:18px;border:1px solid #82633b;border-radius:8px;width:215px}button,select,input{background:#31271c;color:#f0dcb6;padding:8px;border:1px solid #82633b;margin:3px}h1{font-size:18px;margin:0 0 8px}p{line-height:1.5;font-size:12px}#status{font-size:11px;line-height:1.7;color:#a59b8c}button.active{background:#806235;color:white}#footer{position:absolute;bottom:16px;left:24px;color:#8b847c;font-size:12px;letter-spacing:2px}input{width:180px}a{color:#e8bd70}@media(max-width:800px){#controls{transform:scale(.78);transform-origin:top left}}</style><script type="importmap">{"imports":{"three":"./three.module.js"}}</script><div id="controls"><h1>赤霄龍鎧 · R10</h1><p>同一套綁骨人物、材質與武器<br>拖曳旋轉 · 滾輪縮放</p><select id="action"></select><p><button id="spin">自動轉向</button><button id="pause">暫停</button><button id="fx" class="active">光效開</button><button id="cape" class="active">披風開</button></p><label>動作時間 <input id="time" type="range" min="0" max="1" step=".005" value="0"></label><p id="directions"></p><p><a href="./index.html">進入遊戲整合版 →</a></p><div id="status">載入免費 CC0 綁骨基底與重製甲片…</div></div><div id="footer">R10 / CHARACTER ATELIER / COMPLETE BRANCH</div><script type="module">
import * as THREE from 'three';
import {loadCharacter,R10Character,CharacterRenderer} from './r10-character.js';
import {OrbitControls} from './OrbitControls.js';
const gltf=await loadCharacter(),char=new R10Character(gltf),r=new CharacterRenderer({size:1024,alpha:false}),renderer=r.renderer,scene=r.scene;
r.setCharacter(char);renderer.setSize(innerWidth,innerHeight);renderer.setClearColor('#181923');document.body.append(renderer.domElement);
const camera=new THREE.PerspectiveCamera(31,innerWidth/innerHeight,.01,30);camera.position.set(.85,.87,2.7);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.59,0);controls.update();const grid=new THREE.GridHelper(4,40,0x685032,0x262833);scene.add(grid);
const pedestal=new THREE.Mesh(new THREE.CylinderGeometry(.56,.58,.035,64),new THREE.MeshStandardMaterial({color:0x292522,roughness:.8,metalness:.3}));pedestal.position.y=-.023;scene.add(pedestal);
const names={idle:'待機',walk_loop:'行走',jog_fwd_loop:'奔跑',sword_regular_a:'揮刀 A',sword_regular_b:'揮刀 B',sword_regular_c:'迴旋重斬',hit_chest:'受擊',death:'倒地'};
const sel=document.querySelector('#action');gltf.animations.forEach(c=>sel.add(new Option(names[c.name],c.name)));sel.value='idle';let pose='idle',clock=0,spin=false;const play=n=>{pose=n;clock=0;sel.value=n;};sel.onchange=()=>play(sel.value);
const lab=window.lab={scene,camera,renderer,model:char.root,gltf,bones:char.bones,char,play,seek:(t)=>{clock=t;char.pose(pose,t,{moving:pose.includes('loop'),dead:pose==='death'});renderer.render(scene,camera);},pause:false,setYaw(y){char.root.rotation.y=y;renderer.render(scene,camera);},setEffects(v){char.setEffects(v);},render(){renderer.render(scene,camera);},setCamera(x,y,z,ty=.59){camera.position.set(x,y,z);controls.target.set(0,ty,0);controls.update();renderer.render(scene,camera);}};
document.querySelector('#spin').onclick=e=>{spin=!spin;e.target.classList.toggle('active',spin);};document.querySelector('#pause').onclick=e=>{lab.pause=!lab.pause;e.target.textContent=lab.pause?'繼續':'暫停';};document.querySelector('#fx').onclick=e=>{char.setEffects(!char.effects);e.target.textContent=char.effects?'光效開':'光效關';e.target.classList.toggle('active',char.effects);};document.querySelector('#cape').onclick=e=>{char.capeGroup.visible=!char.capeGroup.visible;e.target.classList.toggle('active',char.capeGroup.visible);};document.querySelector('#time').oninput=e=>{lab.pause=true;lab.seek(+e.target.value*char.clips[pose].duration);};

let last=performance.now();function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;if(!lab.pause){clock+=dt;char.pose(pose,clock,{moving:pose.includes('loop'),dead:pose==='death'});}if(spin)char.root.rotation.y+=dt*.5;controls.update();renderer.render(scene,camera);requestAnimationFrame(frame)}requestAnimationFrame(frame);
